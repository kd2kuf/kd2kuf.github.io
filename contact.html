<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLX Mastering — Contact</title>
<style>
:root {
  --bg: #000;
  --fg-dim: rgba(255,255,255,0.18);
  --fg-mid: rgba(255,255,255,0.55);
  --fg-bright: rgba(255,255,255,0.85);
  --accent: rgba(255,255,255,0.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Georgia', serif;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url('nyc-bg.jpg') center/cover no-repeat;
  opacity: 0.22;
  z-index: 0;
}

.pick-container {
  position: relative;
  z-index: 1;
  width: min(680px, 92vw);
  background: rgba(0,0,0,0.82);
  clip-path: polygon(
    12% 0%,
    88% 0%,
    100% 10%,
    100% 60%,
    50% 100%,
    0% 60%,
    0% 10%
  );
  padding: 52px 80px 110px;
  text-align: center;
}

.pick-label {
  font-family: 'Georgia', serif;
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: normal;
  color: var(--fg-bright);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}

.pick-location {
  font-family: 'Georgia', serif;
  font-size: clamp(0.85rem, 2vw, 1rem);
  color: var(--accent);
  letter-spacing: 0.18em;
  margin-bottom: 6px;
}

.pick-services {
  font-family: 'Georgia', serif;
  font-size: clamp(0.75rem, 1.6vw, 0.9rem);
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.12em;
  margin-bottom: 32px;
}

.pick-services a {
  color: rgba(255,255,255,0.45);
  text-decoration: none;
  transition: color 0.2s;
}
.pick-services a:hover { color: rgba(255,255,255,0.9); }

.contact-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: left;
}

.name-email-row {
  display: flex;
  gap: 12px;
}
.name-email-row input { flex: 1; }

.contact-form select {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.85);
  font-family: 'Georgia', serif;
  font-size: clamp(0.75rem, 1.6vw, 0.875rem);
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.2s;
  letter-spacing: 0.04em;
  appearance: none;
  cursor: pointer;
}
.contact-form select:focus { border-color: rgba(255,255,255,0.45); }
.contact-form select option { background: #111; color: rgba(255,255,255,0.85); }

.contact-form input,
.contact-form textarea {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.85);
  font-family: 'Georgia', serif;
  font-size: clamp(0.75rem, 1.6vw, 0.875rem);
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.2s;
  letter-spacing: 0.04em;
}

.contact-form input:focus,
.contact-form textarea:focus {
  border-color: rgba(255,255,255,0.45);
}

.contact-form input::placeholder,
.contact-form textarea::placeholder {
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.06em;
}

.contact-form textarea {
  resize: vertical;
  min-height: 100px;
}

.contact-form button {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: rgba(255,255,255,0.6);
  font-family: 'Georgia', serif;
  font-size: clamp(0.75rem, 1.6vw, 0.875rem);
  letter-spacing: 0.18em;
  padding: 10px 24px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
  align-self: center;
  margin-top: 4px;
}

.contact-form button:hover {
  border-color: rgba(255,255,255,0.7);
  color: rgba(255,255,255,0.95);
}

.form-note {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.2);
  text-align: center;
  margin-top: 4px;
  letter-spacing: 0.06em;
}

.back-link {
  display: block;
  margin-top: 28px;
  font-size: clamp(0.7rem, 1.4vw, 0.8rem);
  color: rgba(255,255,255,0.25);
  text-decoration: none;
  letter-spacing: 0.12em;
  transition: color 0.2s;
}
.back-link:hover { color: rgba(255,255,255,0.7); }

@media (max-width: 600px) {
  .pick-container {
    width: 100vw;
    clip-path: polygon(12% 0%, 88% 0%, 100% 10%, 100% 60%, 50% 100%, 0% 60%, 0% 10%);
    padding: 60px 36px 130px;
  }
  .pick-label { font-size: 2rem !important; }
  .pick-location { font-size: 1rem !important; }
  .pick-services { font-size: 0.9rem !important; margin-bottom: 20px; }
  .contact-form { gap: 8px; }
  .contact-form input,
  .contact-form select,
  .contact-form button { font-size: 0.95rem !important; padding: 10px 14px; }
  .contact-form textarea { font-size: 0.95rem !important; padding: 10px 14px; min-height: 60px; }
  .name-email-row { flex-direction: column; gap: 8px; }
  .back-link { font-size: 0.85rem !important; margin-top: 14px; }
}
</style>

<div class="pick-container">
  <div class="pick-label">PLX Mastering</div>
  <div class="pick-location">New York, NY</div>
  <div class="pick-services">Digital - ATMOS - Lacquer</div>

  <form class="contact-form" action="https://formspree.io/f/myeepaad" method="POST">
    <div class="name-email-row">
      <input type="text" name="name" placeholder="Your name" required>
      <input type="email" name="email" placeholder="you@studio.com" required>
    </div>
    <input type="text" name="project" placeholder="Song, EP or album title">
    <select name="service">
      <option value="" disabled selected>Select a service</option>
      <option value="Stereo Mastering">Stereo Mastering</option>
      <option value="Atmos Mastering / Creation">Atmos Mastering / Creation</option>
      <option value="Vinyl Mastering & Cutting">Vinyl Mastering &amp; Cutting</option>
      <option value="Multiple services">Multiple services</option>
    </select>
    <textarea name="message" placeholder="Tell us about your project"></textarea>
    <button type="submit">Send Message</button>
    <p class="form-note" id="form-note"></p>
  </form>

</div>

<script>
const form = document.querySelector('.contact-form');
const note = document.getElementById('form-note');

form.addEventListener('submit', function(e) {
  if (form.action.includes('REPLACE_ME')) {
    e.preventDefault();
    window.location.href = 'mailto:PLXmastering@gmail.com'
      + '?subject=' + encodeURIComponent(form.subject?.value || 'PLX Mastering Inquiry')
      + '&body=' + encodeURIComponent(
          'From: ' + (form.name?.value || '') + '\n\n' + (form.message?.value || '')
        );
  }
});
</script>
