<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLX Mastering — Contact</title>
<style>
:root { --bg: #000; --fg-bright: rgba(255,255,255,0.85); --accent: rgba(255,255,255,0.4); color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Georgia', serif; position: relative; }
body::before { content: ''; position: fixed; inset: 0; background: url('nyc-bg.jpg') center/cover no-repeat; opacity: 0.22; z-index: 0; }
.top-back { position: fixed; top: 20px; right: 24px; font-family: 'Georgia', serif; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.45); text-decoration: none; transition: color 0.2s; z-index: 10; }
.top-back:hover { color: rgba(255,255,255,0.9); }
.pick-container { position: relative; z-index: 1; width: min(680px, 92vw); background: rgba(0,0,0,0.5); clip-path: polygon(12% 0%, 88% 0%, 100% 10%, 100% 60%, 50% 100%, 0% 60%, 0% 10%); padding: 52px 80px 120px; text-align: center; }
.pick-label { font-family: 'Georgia', serif; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: normal; color: var(--fg-bright); letter-spacing: 0.04em; margin-bottom: 6px; }
.pick-location { font-family: 'Georgia', serif; font-size: clamp(0.85rem, 2vw, 1rem); color: var(--accent); letter-spacing: 0.18em; margin-bottom: 6px; }
.pick-services { font-family: 'Georgia', serif; font-size: clamp(0.75rem, 1.6vw, 0.9rem); color: rgba(255,255,255,0.35); letter-spacing: 0.12em; margin-bottom: 32px; }
.contact-form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
.name-email-row { display: flex; gap: 12px; }
.name-email-row input { flex: 1; }
.contact-form input, .contact-form textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.85); font-family: 'Georgia', serif; font-size: clamp(0.75rem, 1.6vw, 0.875rem); padding: 10px 14px; outline: none; transition: border-color 0.2s; letter-spacing: 0.04em; }
.contact-form input:focus, .contact-form textarea:focus { border-color: rgba(255,255,255,0.45); }
.contact-form input::placeholder, .contact-form textarea::placeholder { color: rgba(255,255,255,0.25); letter-spacing: 0.06em; }
.contact-form textarea { resize: none; height: 90px; }
.word-count { font-size: 0.65rem; color: rgba(255,255,255,0.2); text-align: right; letter-spacing: 0.06em; margin-top: -6px; }
.word-count.over { color: rgba(255,80,80,0.7); }
.contact-form button { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); font-family: 'Georgia', serif; font-size: clamp(0.75rem, 1.6vw, 0.875rem); letter-spacing: 0.18em; padding: 10px 24px; cursor: pointer; transition: border-color 0.2s, color 0.2s; align-self: center; margin-top: 4px; }
.contact-form button:hover { border-color: rgba(255,255,255,0.7); color: rgba(255,255,255,0.95); }
@media (max-width: 600px) { .pick-container { width: 100vw; padding: 60px 36px 130px; } .name-email-row { flex-direction: column; gap: 8px; } }
</style>
<a class="top-back" href="artists.html">← Artists</a>
<div class="pick-container">
  <div class="pick-label">PLX Mastering</div>
  <div class="pick-location">New York, NY</div>
  <div class="pick-services">Digital - ATMOS - Lacquer</div>
  <form class="contact-form" action="https://formspree.io/f/myeepaad" method="POST">
    <div class="name-email-row">
      <input type="text" name="name" placeholder="Your name" required>
      <input type="email" name="email" placeholder="you@studio.com" required>
    </div>
    <input type="text" name="project" placeholder="Song, EP or album title">
    <textarea name="message" id="message" placeholder="Tell us about your project"></textarea>
    <div class="word-count" id="word-count">0 / 232</div>
    <button type="submit">Send Message</button>
  </form>
</div>
<script>
const msg = document.getElementById('message');
const wc = document.getElementById('word-count');
const LIMIT = 232;
msg.addEventListener('input', function() {
  const words = this.value.trim() === '' ? 0 : this.value.trim().split(/\s+/).length;
  if (words > LIMIT) {
    this.value = this.value.trim().split(/\s+/).slice(0, LIMIT).join(' ');
    wc.textContent = LIMIT + ' / ' + LIMIT;
  } else {
    wc.textContent = words + ' / ' + LIMIT;
  }
});
</script>
